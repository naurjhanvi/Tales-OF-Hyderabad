services:
  postgres:
    image: postgres:17-alpine
    container_name: toh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tales_of_hyderabad
      POSTGRES_USER: tales
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - toh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tales -d tales_of_hyderabad"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  toh-postgres-data:
